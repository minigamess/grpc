name: Manual C# Unity Package (macOS ARM64)

on:
  workflow_dispatch:

jobs:
  build-macos-x64-native:
    runs-on: macos-13
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake 3.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6

      - name: Build grpc_csharp_ext for macOS x64
        run: |
          mkdir -p artifacts/csharp_ext_macos_x64
          ARTIFACTS_OUT="$GITHUB_WORKSPACE/artifacts/csharp_ext_macos_x64" GRPC_CSHARP_BUILD_EXT_ARCH=x86_64 bash tools/run_tests/artifacts/build_artifact_csharp.sh

      - name: Upload macOS x64 native artifact
        uses: actions/upload-artifact@v4
        with:
          name: grpc-csharp-ext-macos-x64
          path: artifacts/csharp_ext_macos_x64/libgrpc_csharp_ext.dylib

  build-unity-package:
    needs: build-macos-x64-native
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Setup CMake 3.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6

      - name: Prepare input artifacts
        run: |
          mkdir -p input_artifacts
          bash src/csharp/nuget_helpers/create_fake_native_artifacts.sh
          cp -R src/csharp/nativelibs/csharp_ext_* input_artifacts/

      - name: Download macOS x64 native artifact
        uses: actions/download-artifact@v4
        with:
          name: grpc-csharp-ext-macos-x64
          path: input_artifacts/csharp_ext_macos_x64

      - name: Build grpc_csharp_ext for macOS arm64
        run: |
          rm -rf cmake/build
          ARTIFACTS_OUT="$GITHUB_WORKSPACE/input_artifacts/csharp_ext_macos_arm64" GRPC_CSHARP_BUILD_EXT_ARCH=arm64 bash tools/run_tests/artifacts/build_artifact_csharp.sh

      - name: Build grpc_csharp_ext for iOS
        run: |
          rm -rf cmake/build
          ARTIFACTS_OUT="$GITHUB_WORKSPACE/input_artifacts/csharp_ext_macos_ios" bash tools/run_tests/artifacts/build_artifact_csharp_ios.sh

      - name: Build Unity package zip
        env:
          EXTERNAL_GIT_ROOT: ${{ github.workspace }}
        run: bash src/csharp/build_unitypackage.sh

      - name: Upload Unity package
        uses: actions/upload-artifact@v4
        with:
          name: grpc-unity-package
          path: artifacts/grpc_unity_package.*.zip

      - name: Upload macOS ARM64 native artifact
        uses: actions/upload-artifact@v4
        with:
          name: grpc-csharp-ext-macos-arm64
          path: input_artifacts/csharp_ext_macos_arm64/libgrpc_csharp_ext.dylib
